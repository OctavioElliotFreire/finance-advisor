services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: family_finance
      POSTGRES_USER: finance_app
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U finance_app -d family_finance
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
